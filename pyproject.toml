[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhorn-ui"
version = "0.1.0"
description = "pyhorn desktop UI (Tauri + React + FastAPI)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Guillaume de Boyer-Montegut" }]
requires-python = ">=3.10"
dependencies = [
    "pyhorn>=0.1.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "httpx>=0.24.0"]

[tool.setuptools.packages.find]
where = ["pyhorn_ui"]
include = ["pyhorn_ui*"]

[tool.pytest.ini_options]
testpaths = ["pyhorn_ui/tests"]
addopts = "-q --tb=short"
